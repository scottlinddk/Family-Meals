<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingen forbindelse · Family Meals</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#dff0dc" />
    <!--
      Served by the service worker when a page is asked for with no connection
      and no cached copy. Deliberately standalone: no build assets, no fonts,
      no scripts — everything it needs to render is in this file, because the
      situation it renders in is "nothing else could be fetched".
    -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #ffffff;
        color: #151a14;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 1rem 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #7c857a;
        line-height: 1.55;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #ffffff;
        background: #1f4d2c;
        border: none;
        border-radius: 999px;
        padding: 0.75rem 1.5rem;
        cursor: pointer;
      }
      button:active {
        background: #153a21;
      }
      img {
        width: 72px;
        height: 72px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Ingen forbindelse</h1>
      <p>
        Denne side kunne ikke hentes, og der er ingen gemt udgave af den på telefonen. Sider du har
        åbnet før — blandt andet indkøbslisten — virker stadig offline.
      </p>
      <button type="button" onclick="location.reload()">Prøv igen</button>
    </main>
  </body>
</html>
