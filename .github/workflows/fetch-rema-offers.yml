# Runs the offer fetch from a network api.etilbudsavis.dk answers.
#
# The API 403s this project's dev sandbox, so `EtilbudsavisOfferSource` has
# only ever been covered by fixture tests. This exercises it against the live
# API and commits the result as JSON, which is also how the offer set gets
# loaded when the app's "Fetch offers now" button can't be reached.
name: Fetch REMA offers

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the fetched JSON to this branch"
        type: boolean
        default: true
  push:
    paths:
      - "scripts/fetchRemaOffers.ts"
      - ".github/workflows/fetch-rema-offers.yml"

permissions:
  contents: write

# Shared with scrape-rema-recipes.yml: both commit into scrape-output/ on the
# same ref, so let them queue instead of racing each other's pushes.
concurrency:
  group: scrape-output-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Fetch offers
        run: npx vite-node --config vitest.config.ts scripts/fetchRemaOffers.ts -- rema1000 scrape-output/rema-offers.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rema-offers
          path: scrape-output/rema-offers.json
      - name: Commit the offers
        if: ${{ github.event_name == 'push' || inputs.commit }}
        env:
          MESSAGE: "Fetch REMA 1000's current offers from etilbudsavis [skip ci]"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The ref can move while the fetch runs — the sibling recipe scrape
          # commits into the same directory. So replay the fresh output onto
          # whatever the ref points at now, and redo that if the push loses
          # another race.
          staged=$(mktemp -d)
          cp -R scrape-output/. "$staged"/
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD
            mkdir -p scrape-output
            cp -R "$staged"/. scrape-output/
            git add -A -f scrape-output
            if git diff --cached --quiet; then
              echo "no changes"
              exit 0
            fi
            git commit -m "$MESSAGE"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt; retrying against the new tip"
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the offers after 5 attempts"
          exit 1
