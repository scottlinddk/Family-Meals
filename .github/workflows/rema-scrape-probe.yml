# Temporary: runs scripts/probeRemaSite.mjs from a network the recipe site
# answers, and commits the captured pages so the crawler can be written
# against real markup. Remove together with the script.
name: REMA scrape probe

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probeRemaSite.mjs"
      - ".github/workflows/rema-scrape-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/probeRemaSite.mjs
      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A scrape-captures
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Capture REMA listing markup for the crawler [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
